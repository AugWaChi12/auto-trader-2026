<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Radar</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1d2129; --muted: #6b7280; --line: #e5e7eb; --chip: #eef0f3;
    --up: #0f9d58; --down: #d93025; --accent: #b8860b; --warn: #c77700; --track: #e9ecf1;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --card: #181b21; --text: #e6e8eb; --muted: #8b93a1; --line: #262a33; --chip: #222630;
            --up: #34c77b; --down: #ff6b5e; --accent: #e0b04b; --warn: #f2b632; --track: #262a33; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 13px/1.45 "Segoe UI", "Leelawadee UI", "Noto Sans Thai", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line);
           background: var(--card); flex-wrap: wrap; position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 16px; margin: 0; }
  header a { color: var(--accent); text-decoration: none; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 9px; font-size: 12px; white-space: nowrap; }
  .spacer { flex: 1; }
  .note { max-width: 1400px; margin: 12px auto 0; padding: 0 16px; color: var(--muted); font-size: 12.5px; }
  .note b { color: var(--text); }
  .grid { max-width: 1400px; margin: 0 auto; display: grid; gap: 12px; padding: 12px 16px 24px;
          grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
  .card.hot { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .card.open { border-color: var(--up); box-shadow: 0 0 0 1px var(--up) inset; }
  .top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .top b { font-size: 14px; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 6px; background: var(--chip); color: var(--muted); }
  .badge.fail { color: var(--down); background: color-mix(in srgb, var(--down) 12%, transparent); }
  .badge.test { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .badge.dead { color: var(--down); }
  .state { margin: 8px 0 2px; font-weight: 600; }
  .detail { color: var(--muted); font-size: 12px; min-height: 1.4em; }
  .gauge { position: relative; height: 12px; background: var(--track); border-radius: 7px; overflow: hidden; margin: 8px 0 3px; }
  .gauge i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 7px; transition: width .4s; }
  .grow { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }
  .side { font-weight: 700; }
  .side.BUY { color: var(--up); } .side.SELL { color: var(--down); }
  .prob { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .prob .k { color: var(--muted); font-size: 11.5px; }
  .prob .v { font-weight: 650; font-variant-numeric: tabular-nums; }
  .winbar { grid-column: 1 / -1; display: flex; height: 8px; border-radius: 5px; overflow: hidden; }
  .winbar span:first-child { background: var(--up); } .winbar span:last-child { background: var(--down); }
  .hist { grid-column: 1 / -1; display: flex; align-items: flex-end; gap: 3px; height: 46px; margin-top: 2px; }
  .hist div { flex: 1; border-radius: 3px 3px 0 0; min-height: 1px; }
  .hl { grid-column: 1 / -1; display: flex; gap: 3px; font-size: 9.5px; color: var(--muted); }
  .hl span { flex: 1; text-align: center; }
  .ci { grid-column: 1 / -1; font-size: 11.5px; }
  .live { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .pos { margin-top: 6px; font-size: 12px; font-weight: 600; }
  .up { color: var(--up); } .down { color: var(--down); }
</style>
</head>
<body>
<header>
  <h1>📡 Signal Radar</h1>
  <a href="/">← ภาพรวม</a> <a href="/charts">📈 กราฟ</a> <a href="/techniques">📚 เทคนิค</a>
  <span class="spacer"></span>
  <span class="chip" id="summary">…</span>
  <span class="chip" id="updated">…</span>
</header>
<div class="note">
  เกจ = <b>ใกล้เข้าเงื่อนไขแค่ไหน</b> (100% = เข้า/กำลังจะเข้า) · ตัวเลขใต้เส้นประ = <b>ถ้าเงื่อนไขนี้เข้า อดีต 12 เดือนเป็นอย่างไร</b> (backtest หลังหักต้นทุน) ·
  <b>CI95</b> = ช่วงที่ค่าเฉลี่ยจริงน่าจะอยู่ — ถ้าคร่อม 0 แปลว่าแยกจากโชคไม่ได้ · ป้ายแดง = ตกเกณฑ์วิจัยแล้ว
  <span id="statsAge"></span>
</div>
<div class="grid" id="grid"></div>

<script>
const TZ = "Asia/Bangkok";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sign = (v, d = 2) => (v > 0 ? "+" : "") + v.toFixed(d);
const NAMES = {
  session_momentum: "ตามทิศช่วงเช้า", breakout: "ทะลุกรอบ session", sweep: "กวาด stop ขอบกรอบ",
  rsi2: "RSI(2) สวนสั้น", ema_cross: "EMA ตัดกัน", bb_fade: "Bollinger สวนกลับ",
  vol_expansion: "เงียบ → ระเบิด", level_sweep: "กวาด stop ที่ระดับสำคัญ", trend_pullback: "ย่อในเทรนด์",
  benchmark: "กลุ่มควบคุม — ใช้เทียบว่ากลยุทธ์อื่นดีกว่าการสุ่มจริงไหม",
};

function card(c) {
  const st = c.status || {}, s = c.stats || {};
  const prox = Math.round((st.proximity || 0) * 100);
  const sideCol = st.side === "BUY" ? "var(--up)" : st.side === "SELL" ? "var(--down)" : "var(--muted)";
  const verdict = s.verdict || "";
  const vcls = verdict.startsWith("ตก") ? "fail" : verdict.startsWith("กลุ่มควบคุม") ? "" : verdict ? "test" : "";
  const cls = c.open.length ? "card open" : prox >= 80 ? "card hot" : "card";
  let prob = '<div class="prob"><div class="k" style="grid-column:1/-1">ยังไม่มีสถิติ — รัน python -m bot radar-stats</div></div>';
  if (s.n) {
    const win = Math.round(s.win_rate * 100);
    const ev = s.exp_r * c.risk_usd;
    const maxH = Math.max(...s.hist, 1);
    const ciZero = s.ci95 && s.ci95[0] < 0 && s.ci95[1] > 0;
    prob = `<div class="prob">
      <div><div class="k">โอกาสชนะ</div><div class="v">${win}%</div></div>
      <div><div class="k">ค่าคาดหวัง/ไม้</div><div class="v ${s.exp_r > 0 ? "up" : "down"}">${sign(s.exp_r, 3)}R ≈ ${sign(ev)}$</div></div>
      <div class="winbar"><span style="width:${win}%"></span><span style="width:${100 - win}%"></span></div>
      <div><div class="k">ชนะได้เฉลี่ย</div><div class="v up">${sign(s.avg_win)}R</div></div>
      <div><div class="k">แพ้เสียเฉลี่ย</div><div class="v down">${sign(s.avg_loss)}R</div></div>
      <div class="hist">${s.hist.map((h, i) => `<div title="${s.hist_labels[i]}R: ${h} ไม้" style="height:${h / maxH * 100}%;background:${i < 3 ? "var(--down)" : i === 3 ? "var(--muted)" : "var(--up)"}"></div>`).join("")}</div>
      <div class="hl">${s.hist_labels.map(l => `<span>${l}</span>`).join("")}</div>
      <div class="ci">${s.n} ไม้ใน 12 เดือน (~${s.per_week}/สัปดาห์) · CI95 [${s.ci95?.map(x => sign(x, 2)).join(", ")}]R
        ${ciZero ? '<span class="down">· แยกจากโชคไม่ได้</span>' : s.ci95 && s.ci95[1] < 0 ? '<b class="down">· ขาดทุนชัดเจน</b>' : '<b class="up">· บวกชัดเจน</b>'}</div>
    </div>`;
  }
  const live = c.live.trades
    ? `บน demo: ${c.live.trades} ไม้ ชนะ ${c.live.wins} · <span class="${c.live.pnl >= 0 ? "up" : "down"}">${sign(c.live.pnl)}$</span>`
    : "บน demo: ยังไม่มีไม้ที่ปิด";
  const pos = c.open.map(o => `<div class="pos">● เปิดอยู่ ${o.side} ${o.volume} @${o.open_price} · <span class="${o.profit >= 0 ? "up" : "down"}">${sign(o.profit)}$</span></div>`).join("");
  return `<div class="${cls}">
    <div class="top"><b>${esc(c.tag)}</b><span class="badge">${esc(c.symbol || "")} ${esc(c.tf)}</span>
      <span class="badge">${esc(c.instance)}</span>${verdict ? `<span class="badge ${vcls}">${esc(verdict)}</span>` : ""}
      ${c.alive ? "" : '<span class="badge dead">● บอทไม่ทำงาน</span>'}</div>
    <div class="detail">${esc(NAMES[st.type] || st.type || "")}</div>
    <div class="state">${esc(st.state || "รอสถานะจากบอท")}</div>
    <div class="gauge"><i style="width:${prox}%;background:${sideCol}"></i></div>
    <div class="grow"><span>${st.side ? `<span class="side ${st.side}">${st.side}</span>` : "–"}</span><span>${prox}%</span></div>
    <div class="detail">${esc(st.detail || "")}</div>
    ${pos}
    ${prob}
    <div class="live">${live}</div>
  </div>`;
}

async function refresh() {
  let d;
  try { d = await (await fetch("/api/radar", { cache: "no-store" })).json(); }
  catch { $("updated").textContent = "ต่อ monitor ไม่ได้"; return; }
  if (d.error) { $("grid").innerHTML = `<div class="card">เชื่อม MT5 ไม่ได้: ${esc(d.error)}</div>`; return; }
  $("grid").innerHTML = d.cards.map(card).join("");
  const hot = d.cards.filter(c => (c.status?.proximity || 0) >= 0.8).length;
  const open = d.cards.reduce((n, c) => n + c.open.length, 0);
  $("summary").textContent = `${d.cards.length} กลยุทธ์ · ใกล้เข้า ${hot} · ไม้เปิด ${open}`;
  $("updated").textContent = "อัปเดต " + new Intl.DateTimeFormat("th-TH", { timeZone: TZ, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }).format(new Date(d.now));
  if (d.stats_generated_at) $("statsAge").textContent = " · สถิติคำนวณเมื่อ " + new Intl.DateTimeFormat("th-TH", { timeZone: TZ, dateStyle: "short", timeStyle: "short" }).format(new Date(d.stats_generated_at));
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
