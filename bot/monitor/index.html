<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold Bot Monitor</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1d2129; --muted: #6b7280; --line: #e5e7eb;
    --up: #0f9d58; --down: #d93025; --accent: #b8860b; --warn: #e8a100; --chip: #eef0f3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --card: #181b21; --text: #e6e8eb; --muted: #8b93a1; --line: #262a33;
            --up: #34c77b; --down: #ff6b5e; --accent: #e0b04b; --warn: #f2b632; --chip: #222630; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 "Segoe UI", "Leelawadee UI", "Noto Sans Thai", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line);
           background: var(--card); position: sticky; top: 0; z-index: 2; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; }
  header h1 span { color: var(--accent); }
  .chip { background: var(--chip); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; white-space: nowrap; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .spacer { flex: 1; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; display: grid; gap: 14px;
         grid-template-columns: repeat(12, 1fr); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  .card h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 10px; text-transform: none; }
  .kpi { grid-column: span 3; }
  .kpi .v { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .kpi .s { color: var(--muted); font-size: 12.5px; }
  .wide { grid-column: span 12; }
  .half { grid-column: span 6; }
  .up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
  td.num, th.num { text-align: right; }
  .scroll { overflow-x: auto; }
  .empty { color: var(--muted); padding: 14px 4px; }
  .side { font-weight: 650; font-size: 12px; padding: 2px 7px; border-radius: 6px; }
  .side.BUY { background: color-mix(in srgb, var(--up) 15%, transparent); color: var(--up); }
  .side.SELL { background: color-mix(in srgb, var(--down) 15%, transparent); color: var(--down); }
  .bar { height: 10px; background: var(--chip); border-radius: 6px; position: relative; overflow: hidden; margin: 8px 0 4px; }
  .bar > i { position: absolute; top: 0; bottom: 0; border-radius: 6px; }
  .bar .mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 2px; background: var(--muted); }
  .bar .th { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--accent); }
  .sig-row { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
  .big { font-size: 18px; font-weight: 650; }
  pre { margin: 0; font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-all;
        max-height: 260px; overflow: auto; color: var(--muted); }
  pre b { color: var(--text); font-weight: 600; }
  svg { display: block; width: 100%; height: 150px; }
  .err { background: color-mix(in srgb, var(--down) 12%, var(--card)); border-color: var(--down); }
  @media (max-width: 860px) { .kpi { grid-column: span 6; } .half { grid-column: span 12; } }
  @media (max-width: 480px) { main { padding: 10px; } .kpi { grid-column: span 12; } }
</style>
</head>
<body>
<header>
  <h1>🤖 Gold Bot <span>Monitor</span></h1>
  <span class="chip" id="botChip">…</span>
  <span class="chip" id="mt5Chip">…</span>
  <span class="chip" id="acctChip">…</span>
  <span class="spacer"></span>
  <span class="chip muted" id="updated">กำลังโหลด…</span>
</header>

<main>
  <div class="card wide err" id="errorCard" hidden></div>

  <div class="card kpi"><h2>Equity</h2><div class="v" id="equity">–</div><div class="s" id="balance">–</div></div>
  <div class="card kpi"><h2>กำไรวันนี้</h2><div class="v" id="today">–</div><div class="s" id="todayN">–</div></div>
  <div class="card kpi"><h2>กำไรรวม (บอท)</h2><div class="v" id="total">–</div><div class="s" id="winrate">–</div></div>
  <div class="card kpi"><h2>ไม้ที่เปิดอยู่</h2><div class="v" id="openN">–</div><div class="s" id="floating">–</div></div>

  <div class="card half" id="signalCard"><h2>สัญญาณวันนี้</h2><div id="signals" class="empty">–</div></div>
  <div class="card half"><h2>Equity (ทั้งบัญชี)</h2><div id="curve" class="empty">–</div></div>

  <div class="card wide"><h2>ไม้ที่เปิดอยู่</h2><div class="scroll" id="openTable"></div></div>
  <div class="card wide"><h2>ประวัติการเทรด</h2><div class="scroll" id="tradeTable"></div></div>
  <div class="card wide"><h2>บอทกำลังคิดอะไร (log ล่าสุด)</h2><pre id="log">–</pre></div>
</main>

<script>
const TZ = "Asia/Bangkok";
const $ = (id) => document.getElementById(id);
const fmtT = (iso) => iso ? new Intl.DateTimeFormat("th-TH", { timeZone: TZ, day: "2-digit", month: "2-digit",
  hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date(iso)) : "–";
const money = (v, sign = false) => v == null ? "–" :
  (sign && v > 0 ? "+" : "") + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const cls = (v) => v > 0 ? "up" : v < 0 ? "down" : "";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function table(rows, cols) {
  if (!rows.length) return '<div class="empty">ยังไม่มี</div>';
  const head = cols.map(c => `<th class="${c.num ? "num" : ""}">${c.h}</th>`).join("");
  const body = rows.map(r => "<tr>" + cols.map(c => `<td class="${c.num ? "num" : ""} ${c.cls ? c.cls(r) : ""}">${c.f(r)}</td>`).join("") + "</tr>").join("");
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

function curve(points) {
  if (!points || points.length < 2) return '<div class="empty">ยังมีข้อมูลไม่พอ</div>';
  const ys = points.map(p => p[1]);
  const min = Math.min(...ys), max = Math.max(...ys), pad = (max - min) * 0.1 || 1;
  const W = 600, H = 150, n = ys.length;
  const x = (i) => (i / (n - 1)) * W, y = (v) => H - ((v - (min - pad)) / (max - min + 2 * pad)) * H;
  const d = ys.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const col = ys[n - 1] >= ys[0] ? "var(--up)" : "var(--down)";
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${d} L${W},${H} L0,${H} Z" fill="${col}" opacity="0.12"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
    <div class="sig-row"><span>${money(ys[0])}</span><span>ต่ำสุด ${money(min)} · สูงสุด ${money(max)}</span><span>${money(ys[n - 1])}</span></div>`;
}

function signalPanel(d) {
  const strats = d.bot?.strategies || {};
  const out = [];
  for (const [tag, s] of Object.entries(strats)) {
    if (s.type !== "session_momentum") { out.push(`<div><b>${esc(tag)}</b></div>`); continue; }
    const q = d.quotes?.[s.symbol];
    const entryBkk = s.tz === "UTC" ? addHours(s.entry_time, 7) : `${s.entry_time} (${s.tz})`;
    const flatBkk = s.tz === "UTC" ? addHours(s.flat_time, 7) : `${s.flat_time} (${s.tz})`;
    const today = [...d.open, ...d.trades].filter(t => (t.group || "").startsWith(`${tag}:${s.day}`) || (t.tag === tag && sameDay(t.open_time, s.day)));
    let html = `<div class="sig-row"><span><b style="color:var(--text)">${esc(tag)}</b> · ${esc(s.symbol)} · เข้า ${entryBkk} น. ปิด ${flatBkk} น. (เวลาไทย)</span></div>`;
    if (s.range_open == null || s.threshold == null || !q) {
      html += `<div class="empty">รอข้อมูลช่วงเช้า (เริ่มนับ ${s.tz === "UTC" ? addHours(s.measure_start, 7) : s.measure_start} น.)</div>`;
    } else {
      const move = q.bid - s.range_open, th = s.threshold, scale = th * 2;
      const pct = Math.max(-1, Math.min(1, move / scale));
      const left = pct >= 0 ? 50 : 50 + pct * 50, width = Math.abs(pct) * 50;
      const hit = Math.abs(move) >= th;
      const dir = move > 0 ? "ขึ้น" : "ลง";
      html += `<div style="margin-top:8px"><span class="big ${cls(move)}">${move > 0 ? "+" : ""}${move.toFixed(2)}</span>
        <span class="muted"> จากราคาเปิดเช้า ${s.range_open.toFixed(2)} → ตอนนี้ ${q.bid.toFixed(2)}</span></div>
        <div class="bar"><i style="left:${left}%;width:${width}%;background:${move >= 0 ? "var(--up)" : "var(--down)"}"></i>
          <span class="mid"></span><span class="th" style="left:25%"></span><span class="th" style="left:75%"></span></div>
        <div class="sig-row"><span>−${th.toFixed(2)} (SELL)</span><span>เกณฑ์ ±${th.toFixed(2)} = ${s.min_move_adr} × ADR ${s.adr.toFixed(1)}</span><span>+${th.toFixed(2)} (BUY)</span></div>
        <div style="margin-top:8px">${today.length ? `✅ วันนี้เข้าไม้แล้ว (${today.length} รายการ ดูตารางด้านล่าง)` :
          hit ? `⚡ ตอนนี้วิ่ง${dir}เกินเกณฑ์ — ถ้ายังเกินตอน ${entryBkk} น. บอทจะ <b>${move > 0 ? "BUY" : "SELL"}</b> (SL ห่าง ~${(s.sl_adr * s.adr).toFixed(1)})` :
          `⏳ ยังไม่ถึงเกณฑ์ — ต้องวิ่งอีก ${(th - Math.abs(move)).toFixed(2)} ภายใน ${entryBkk} น.`}</div>`;
    }
    out.push(html);
  }
  return out.length ? out.join("<hr style='border:0;border-top:1px solid var(--line)'>") : '<div class="empty">บอทยังไม่ส่งสถานะ</div>';
}
function addHours(hhmm, h) { const [a, b] = hhmm.split(":").map(Number); return `${String((a + h) % 24).padStart(2, "0")}:${String(b).padStart(2, "0")}`; }
function sameDay(iso, day) { return iso && iso.slice(0, 10) === day; }

async function refresh() {
  let d;
  try { d = await (await fetch("/api", { cache: "no-store" })).json(); }
  catch (e) { $("updated").textContent = "ต่อ monitor ไม่ได้"; return; }

  const bot = d.bot || {};
  $("botChip").innerHTML = bot.alive
    ? `<span class="dot" style="background:var(--up)"></span>บอททำงาน · ${esc(bot.profile || "")}`
    : `<span class="dot" style="background:var(--down)"></span>บอทไม่ทำงาน${bot.age_s ? ` (เงียบ ${Math.round(bot.age_s / 60)} นาที)` : ""}`;
  if (bot.killed) $("botChip").innerHTML += ` · <b class="down">KILL SWITCH</b>`;
  else if (bot.halted_today) $("botChip").innerHTML += ` · <b class="down">หยุดวันนี้</b>`;

  $("errorCard").hidden = !d.error;
  if (d.error) { $("errorCard").textContent = "เชื่อม MT5 ไม่ได้: " + d.error; $("log").innerHTML = (d.log || []).map(esc).join("\n"); return; }

  const t = d.terminal, a = d.account, s = d.stats;
  $("mt5Chip").innerHTML = `<span class="dot" style="background:${t.connected ? "var(--up)" : "var(--down)"}"></span>MT5 ${t.connected ? "ออนไลน์" : "หลุด"} · Algo ${t.algo ? "เปิด" : '<b class="down">ปิด</b>'}`;
  $("acctChip").textContent = `${a.demo ? "DEMO" : "REAL"} ${a.login}`;
  $("updated").textContent = "อัปเดต " + new Intl.DateTimeFormat("th-TH", { timeZone: TZ, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }).format(new Date(d.now));

  $("equity").textContent = money(a.equity);
  $("balance").textContent = `balance ${money(a.balance)} ${a.currency} · free margin ${money(a.free_margin)}`;
  $("today").innerHTML = `<span class="${cls(s.today)}">${money(s.today, true)}</span>`;
  $("todayN").textContent = `${s.today_trades} ไม้ที่ปิดวันนี้`;
  $("total").innerHTML = `<span class="${cls(s.total)}">${money(s.total, true)}</span>`;
  $("winrate").textContent = s.trades ? `${s.trades} ไม้ · ชนะ ${s.win_rate}% · ดีสุด ${money(s.best, true)} · แย่สุด ${money(s.worst, true)}` : "ยังไม่มีไม้ที่ปิด";
  $("openN").textContent = d.open.length;
  $("floating").innerHTML = `ลอยอยู่ <span class="${cls(a.floating)}">${money(a.floating, true)}</span>`;

  $("signals").className = "";
  $("signals").innerHTML = signalPanel(d);
  $("curve").className = "";
  $("curve").innerHTML = curve(d.equity_curve);

  $("openTable").innerHTML = table(d.open, [
    { h: "เวลาเข้า", f: r => fmtT(r.open_time) },
    { h: "กลยุทธ์", f: r => `${esc(r.tag)} <span class="muted">${esc(r.role)}</span>` },
    { h: "ทิศ", f: r => `<span class="side ${r.side}">${r.side}</span> ${esc(r.symbol)}` },
    { h: "Lot", num: 1, f: r => r.volume },
    { h: "ราคาเข้า", num: 1, f: r => r.open_price.toFixed(2) },
    { h: "ตอนนี้", num: 1, f: r => r.price.toFixed(2) },
    { h: "SL", num: 1, f: r => r.sl ? r.sl.toFixed(2) : "–" },
    { h: "TP", num: 1, f: r => r.tp ? r.tp.toFixed(2) : "–" },
    { h: "กำไร", num: 1, cls: r => cls(r.profit), f: r => money(r.profit, true) },
  ]);
  $("tradeTable").innerHTML = table(d.trades, [
    { h: "เข้า", f: r => fmtT(r.open_time) },
    { h: "ออก", f: r => fmtT(r.close_time) },
    { h: "กลยุทธ์", f: r => esc(r.tag) },
    { h: "ทิศ", f: r => `<span class="side ${r.side}">${r.side}</span> ${esc(r.symbol)}` },
    { h: "Lot", num: 1, f: r => r.volume },
    { h: "ราคาเข้า", num: 1, f: r => r.open_price.toFixed(2) },
    { h: "ราคาออก", num: 1, f: r => r.close_price.toFixed(2) },
    { h: "ออกเพราะ", f: r => esc(r.reason) },
    { h: "กำไร", num: 1, cls: r => cls(r.profit), f: r => money(r.profit, true) },
  ]);
  $("log").innerHTML = (d.log || []).map(l => {
    const e = esc(l);
    return /SEND|CLOSE|MODIFY|NOTIFY|ERROR|WARNING/.test(l) ? `<b>${e}</b>` : e;
  }).join("\n") || "–";
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
