# Auto trader บน Linux (ทาง A): MT5 ใน Wine + บอททุกตัว + หน้า monitor
#   deploy/deploy.sh จากเครื่อง dev สั่งทุกอย่างให้ · บนเซิร์ฟเวอร์: cd /opt/auto-trader/deploy && docker compose ps
#
# ไม่มี port ไหนเปิดออกอินเทอร์เน็ต: ผูกกับ 127.0.0.1 ของเครื่องเท่านั้น → เข้าจากคอมด้วย SSH tunnel
#   ssh -L 3000:127.0.0.1:3000 -L 8765:127.0.0.1:8765 root@<server>
#   http://localhost:3000 = หน้าจอ MT5 (ล็อกอินบัญชี demo)   ·   http://localhost:8765 = monitor
name: auto-trader

services:
  mt5:
    build:
      context: .
      dockerfile: mt5.Dockerfile          # image ต้นทาง + Wine staging (กัน MT5 ขึ้น "debugger found")
    image: auto-trader-mt5:latest
    container_name: trader-mt5
    restart: unless-stopped
    env_file: .env                       # CUSTOM_USER / PASSWORD ของหน้าจอ VNC (deploy.sh สุ่มให้ครั้งแรก)
    volumes:
      - mt5_config:/config               # MT5 + บัญชีที่ล็อกอินไว้ อยู่รอดตอนรีสตาร์ท
      - ./mt5-rpyc-service.sh:/custom-services.d/mt5-rpyc:ro   # ช่อง Python (port 8001) — แทนตัวของ image ที่พัง
      - ./mt5_rpyc_server.py:/custom-files/mt5_rpyc_server.py:ro
    ports:
      - "127.0.0.1:3000:3000"            # หน้าจอ MT5 ผ่านเว็บ
    mem_limit: 2g
    logging: &logs
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  bots:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        RPYC_VERSION: ${RPYC_VERSION:-5.3.1}
    image: auto-trader:latest
    container_name: trader-bots
    restart: unless-stopped
    command: ["python", "-m", "bot", "supervise"]
    environment:
      # สมอง AI ของผู้จัดการพอร์ต — ใส่คีย์ใน deploy/.env เอง (ว่างทั้งคู่ = สมองตามกฎอย่างเดียว)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}          # aistudio.google.com (มี tier ฟรี)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}   # claude setup-token (แพ็กเกจสมาชิก) → Claude ช่วยตัดสินจังหวะสำคัญ
      MANAGER_CLAUDE_DAILY_MAX: ${MANAGER_CLAUDE_DAILY_MAX:-10}
      MANAGER_CLAUDE_MODEL: ${MANAGER_CLAUDE_MODEL:-opus}
      MANAGER_AI: ${MANAGER_AI:-}                  # gemini | claude (ว่าง = ตามคีย์ที่มี, Gemini ก่อน)
      MANAGER_MODEL: ${MANAGER_MODEL:-}            # ว่าง = gemini-3.8-flash / claude-opus-5-5
      MANAGER_LLM_MIN: ${MANAGER_LLM_MIN:-15}      # ถาม AI ทุกกี่นาที (มีไม้เปิด/ตลาดเปลี่ยน/แกว่งแรง)
      MANAGER_LLM_QUIET_MIN: ${MANAGER_LLM_QUIET_MIN:-45}   # ถามทุกกี่นาทีตอนพอร์ตว่างและตลาดนิ่ง
      MANAGER_LLM_DAILY_MAX: ${MANAGER_LLM_DAILY_MAX:-0}    # เพดานครั้ง/วัน ให้อยู่ในโควตา tier ฟรี (0 = ไม่จำกัด)
      MANAGER_SMART_MODEL: ${MANAGER_SMART_MODEL:-}          # รุ่นฉลาดสำหรับจังหวะสำคัญ (ว่าง = gemini-3.8-flash)
      MANAGER_SMART_DAILY_MAX: ${MANAGER_SMART_DAILY_MAX:-0} # ครั้ง/วันของรุ่นฉลาด (0 = ไม่ใช้)
      # Telegram: ใส่ token ด้วย deploy/set-key.sh TELEGRAM_BOT_TOKEN แล้วทักบอท 1 ครั้ง (chat id จำเอง)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_TRADES: ${TELEGRAM_TRADES:-0}       # 1 = ส่งทุกไม้ของทุกบอทด้วย (ถี่มาก)
      MANAGER_TAKE_PROFIT_USD: ${MANAGER_TAKE_PROFIT_USD:-50}   # บอททดสอบกำไรลอยรวมถึงนี้ → ผู้จัดการปิดทันที (0 = ปิดกฎ)
      RESEARCH_EVERY_DAYS: ${RESEARCH_EVERY_DAYS:-1}   # วิจัยทุกคืนตี 4 (7 = อาทิตย์ละครั้ง · 0 = ปิด)
      MANAGER_PAUSE: ${MANAGER_PAUSE:-0}           # 0 = ไม่พักบอทจริง (ผู้จัดการทำนาย + เรียนรู้) · 1 = พักจริง
      MT5_HOST: mt5
      MT5_PORT: "8001"
      MT5_PATH: 'C:\Program Files\MetaTrader 5\terminal64.exe'   # path ใน Wine (ฝั่ง container mt5)
    volumes:
      - ../state:/app/state
      - ../logs:/app/logs
      - ../data:/app/data                # แท่งราคาที่วิจัยประจำสัปดาห์ดึงมา
    depends_on: [mt5]
    mem_limit: 2300m                     # บอท 20 ตัว + ผู้จัดการ + วิจัยทุกคืน (1 โปรเซส)
    logging: *logs

  monitor:
    image: auto-trader:latest
    container_name: trader-monitor
    restart: unless-stopped
    command: ["python", "-m", "bot", "monitor", "--no-browser"]
    environment:
      MT5_HOST: mt5
      MT5_PORT: "8001"
      MT5_PATH: 'C:\Program Files\MetaTrader 5\terminal64.exe'   # path ใน Wine (ฝั่ง container mt5)
      MONITOR_HOST: 0.0.0.0              # ใน container ต้องรับจากนอก — ด้านนอกยังผูกแค่ 127.0.0.1
    volumes:
      - ../state:/app/state
      - ../logs:/app/logs
    ports:
      - "127.0.0.1:8765:8765"
    depends_on: [mt5, bots]
    mem_limit: 300m
    logging: *logs

  # หน้าสาธารณะ (อ่านอย่างเดียว): https://$PUBLIC_DOMAIN → /sandbox — ตั้ง PUBLIC_DOMAIN ใน deploy/.env
  public:
    image: auto-trader:latest
    container_name: trader-public
    restart: unless-stopped
    command: ["python", "-m", "bot", "monitor", "--no-browser"]
    environment:
      MT5_HOST: mt5
      MT5_PORT: "8001"
      MT5_PATH: 'C:\Program Files\MetaTrader 5\terminal64.exe'
      MONITOR_HOST: 0.0.0.0
      PUBLIC_READONLY: "1"               # เปิดได้แค่ /sandbox + ข้อมูลที่หน้านั้นใช้ · ไม่มีปุ่มสั่งงาน · ไม่โชว์เลขบัญชี/log
    volumes:
      - ../state:/app/state:ro
      - ../logs:/app/logs:ro
    depends_on: [mt5, bots]
    mem_limit: 250m
    logging: *logs

  caddy:
    image: caddy:2-alpine
    container_name: trader-caddy
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [public]
    mem_limit: 100m
    logging: *logs

volumes:
  mt5_config:
  caddy_data:
  caddy_config:
